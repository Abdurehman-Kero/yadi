[project]
name = "yadi-api"
version = "0.1.0"
description = "Yadi API and worker"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn>=0.54",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1,<3",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.20,<2",
  "google-genai>=2.34.0",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=9", "hypothesis>=6", "httpx>=0.28", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yadi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
